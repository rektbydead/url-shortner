services:
  postgres-primary:
    image: docker.io/postgres:18-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
      - PGDATABASE=${DATABASE_NAME}
    volumes:
      - primary_postgres_data:/var/lib/postgresql/18/docker
      - ./postgresql/primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgresql/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgresql/primary/init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica-1:
    extends:
      file: docker-compose.postgres-replica.yml
      service: postgres-replica-base
    depends_on:
      postgres-primary:
        condition: service_healthy

  postgres-replica-2:
    extends:
      file: docker-compose.postgres-replica.yml
      service: postgres-replica-base
    depends_on:
      postgres-primary:
        condition: service_healthy

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    volumes:
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - ./backend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=strip-api,compress"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.middlewares=compress"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  traefik:
    image: docker.io/traefik:v3.7.8
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80" ]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: docker.io/prom/prometheus
    volumes:
      - ./prometheus:/etc/prometheus/
      - prometheus_data:/prometheus
    ports:
      - "8090:8090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  k6:
    image: docker.io/grafana/k6:latest
    volumes:
      - ./k6:/scripts
    depends_on:
      traefik:
        condition: service_healthy

volumes:
  primary_postgres_data:
  prometheus_data:
  prometheus_multiproc:
